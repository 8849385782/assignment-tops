<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Foodie</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='style.css'></head><body class='bg-light'><div class='container'><div class='card shadow'><div class='card-header'><h3>Foodie Signup</h3></div><div class='card-body'><form class='needs-validation' novalidate><div class='form-floating mb-3'><input required class='form-control' placeholder='Username'><label>Username</label><div class='invalid-feedback'>Enter username.</div></div><div class='form-floating mb-3'><input required type='email' class='form-control' placeholder='Email'><label>Email</label><div class='invalid-feedback'>Enter valid email.</div></div><div class='form-floating mb-3'><input required minlength='6' type='password' class='form-control' placeholder='Password'><label>Password</label><div class='invalid-feedback'>Minimum 6 characters.</div></div><button class='btn btn-success w-100'>Sign Up</button></form></div></div></div><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script><script src='script.js'></script><script>(()=>{'use strict';const forms=document.querySelectorAll('.needs-validation');Array.from(forms).forEach(f=>f.addEventListener('submit',e=>{if(!f.checkValidity()){e.preventDefault();e.stopPropagation()}f.classList.add('was-validated');},false));})();</script></body></html>
