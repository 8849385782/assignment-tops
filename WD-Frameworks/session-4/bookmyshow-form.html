<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BookMyShow</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='style.css'></head><body class='bg-light'><div class='container'><div class='card shadow'><div class='card-header'><h3>BookMyShow</h3></div><div class='card-body'><form class='needs-validation' novalidate><div class='form-floating mb-3'><input required class='form-control' placeholder='Movie'><label>Movie Name</label><div class='invalid-feedback'>Enter movie.</div></div><div class='form-floating mb-3'><input required min='1' type='number' class='form-control' placeholder='Tickets'><label>Tickets</label><div class='invalid-feedback'>Minimum 1.</div></div><div class='form-floating mb-3'><input required type='email' class='form-control' placeholder='Email'><label>Email</label><div class='invalid-feedback'>Enter email.</div></div><button class='btn btn-danger w-100'>Book Ticket</button></form></div></div></div><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script><script src='script.js'></script><script>(()=>{'use strict';const forms=document.querySelectorAll('.needs-validation');Array.from(forms).forEach(f=>f.addEventListener('submit',e=>{if(!f.checkValidity()){e.preventDefault();e.stopPropagation()}f.classList.add('was-validated');},false));})();</script></body></html>
