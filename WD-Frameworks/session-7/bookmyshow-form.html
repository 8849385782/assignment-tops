<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BookMyShow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-6"><form class="needs-validation" role="form" novalidate><h2 class="text-center">Movie Booking</h2><div class="mb-3"><label>Name</label><input type="text" class="form-control" required aria-label="Enter Your Name"><div class="valid-feedback">Correct</div><div class="invalid-feedback">Please enter your name.</div></div><div class="mb-3"><label>Email</label><input type="email" class="form-control" required aria-label="Enter Email"><div class="valid-feedback">Correct</div><div class="invalid-feedback">Enter valid email.</div></div><div class="mb-3"><label>Movie</label><select class="form-select" required aria-label="Select Movie"><option value=''>Choose</option><option>Avengers</option></select><div class="valid-feedback">Correct</div><div class="invalid-feedback">Select movie.</div></div><button class="btn btn-danger w-100" type="submit" aria-label="Book Movie Ticket">Book Ticket</button></form></div></div></div><script>(()=>{'use strict';const f=document.querySelectorAll('.needs-validation');Array.from(f).forEach(form=>form.addEventListener('submit',e=>{if(!form.checkValidity()){e.preventDefault();e.stopPropagation()}else{e.preventDefault();alert('Booking Successful!')}form.classList.add('was-validated')}))})();</script></body></html>
