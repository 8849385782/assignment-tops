<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipkart Product Card — box-shadow Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #f1f3f6;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Property in focus: box-shadow --- */
  .product-card {
    background: #ffffff;
    border-radius: 6px;
    width: 280px;
    padding: 18px;
    /* soft, modern elevation: low y-offset, generous blur, slight spread */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05),
                0 12px 24px rgba(0, 0, 0, 0.10);
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }

  .product-card:hover {
    /* deeper shadow + larger blur on hover to feel "lifted" */
    box-shadow: 0 8px 12px rgba(0, 0, 0, 0.08),
                0 24px 40px rgba(0, 0, 0, 0.16);
    transform: translateY(-4px);
  }

  .product-card img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    margin-bottom: 12px;
  }

  .product-title {
    font-size: 1rem;
    font-weight: 600;
    color: #212121;
    margin-bottom: 4px;
  }

  .product-rating {
    background: #388e3c;
    color: #fff;
    font-size: 0.8rem;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 6px;
  }

  .price-now {
    font-size: 1.2rem;
    font-weight: 700;
    color: #212121;
  }

  .price-old {
    font-size: 0.9rem;
    color: #878787;
    text-decoration: line-through;
    margin-left: 6px;
  }

  .price-off {
    font-size: 0.9rem;
    color: #388e3c;
    font-weight: 600;
    margin-left: 6px;
  }

  .buy-btn {
    background-color: #fb641b;
    border: none;
    color: #fff;
    font-weight: 600;
    padding: 8px 0;
    width: 100%;
    border-radius: 4px;
    margin-top: 12px;
  }

  .buy-btn:hover {
    background-color: #e0560f;
    color: #fff;
  }
</style>
</head>
<body>

<div class="product-card">
  <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop"
       alt="Wireless over-ear headphones product photo">
  <div class="product-title">Wireless Over-Ear Headphones, Deep Bass, 40Hr Battery</div>
  <span class="product-rating">4.3 ★</span>
  <div>
    <span class="price-now">₹1,499</span>
    <span class="price-old">₹3,999</span>
    <span class="price-off">62% off</span>
  </div>
  <button type="button" class="buy-btn" id="cartBtn">Add to Cart</button>
</div>

<script>
  // Small JS interaction: confirm add-to-cart
  const cartBtn = document.getElementById('cartBtn');
  cartBtn.addEventListener('click', function () {
    cartBtn.textContent = 'Added ✓';
    setTimeout(function () {
      cartBtn.textContent = 'Add to Cart';
    }, 1500);
  });
</script>

</body>
</html>
