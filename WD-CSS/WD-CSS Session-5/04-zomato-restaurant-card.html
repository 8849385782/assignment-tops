<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zomato Restaurant Card — background-image Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #fff5f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .restaurant-card {
    width: 320px;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }

  /* --- Property in focus: background-image --- */
  .restaurant-photo {
    position: relative;
    height: 190px;
    background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=700&h=450&fit=crop');
    background-size: cover;
    background-position: center;
  }

  .name-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    /* semi-transparent strip so the restaurant name stays readable
       regardless of what is behind it in the photo */
    background: rgba(0, 0, 0, 0.55);
    padding: 10px 14px;
  }

  .name-overlay h2 {
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
  }

  .card-body-custom {
    padding: 14px;
  }

  .cuisine {
    color: #696b79;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  .rating-pill {
    background: #267e3e;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-right: 8px;
  }

  .cost {
    font-size: 0.85rem;
    color: #4f5665;
  }
</style>
</head>
<body>

<div class="restaurant-card">
  <div class="restaurant-photo">
    <div class="name-overlay">
      <h2>Spice Route Kitchen</h2>
    </div>
  </div>
  <div class="card-body-custom">
    <div class="cuisine">North Indian · Mughlai · Biryani</div>
    <span class="rating-pill" id="ratingPill">4.4 ★</span>
    <span class="cost">₹500 for two</span>
  </div>
</div>

<script>
  // Small JS interaction: click the rating to see review count
  const ratingPill = document.getElementById('ratingPill');
  ratingPill.addEventListener('click', function () {
    ratingPill.textContent = '2,340 reviews';
    setTimeout(function () {
      ratingPill.textContent = '4.4 ★';
    }, 1800);
  });
</script>

</body>
</html>
