<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Artist Card — border-radius Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #121212;
    color: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Property in focus: border-radius --- */
  .artist-card {
    background: linear-gradient(180deg, #2a2a2a 0%, #181818 100%);
    border-radius: 22px;           /* rounds the whole card */
    padding: 24px;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .artist-card:hover {
    transform: translateY(-6px);
    background: #282828;
  }

  .artist-card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 16px;           /* rounds the artist photo corners */
    margin-bottom: 18px;
  }

  .artist-name {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .artist-type {
    color: #b3b3b3;
    font-size: 0.9rem;
    margin-bottom: 18px;
  }

  .play-btn {
    background-color: #1DB954;
    border: none;
    border-radius: 50px;           /* fully rounded pill button */
    color: #000;
    font-weight: 700;
    padding: 10px 28px;
  }

  .play-btn:hover {
    background-color: #1ed760;
    color: #000;
  }

  .monthly {
    font-size: 0.8rem;
    color: #b3b3b3;
    margin-left: 10px;
  }
</style>
</head>
<body>

<div class="artist-card">
  <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=600&h=600&fit=crop"
       alt="Portrait of the featured artist on stage">
  <div class="artist-name">Nova Ray</div>
  <div class="artist-type">Artist</div>
  <button type="button" class="play-btn" id="playBtn">Play</button>
  <span class="monthly" id="listeners">4,281,903 monthly listeners</span>
</div>

<script>
  // Small JS interaction: toggle Play / Pause label
  const playBtn = document.getElementById('playBtn');
  let playing = false;

  playBtn.addEventListener('click', function () {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
  });
</script>

</body>
</html>
