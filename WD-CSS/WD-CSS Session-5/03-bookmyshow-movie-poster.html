<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Poster Card — text-shadow Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #0e0e10;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poster-card {
    position: relative;
    width: 300px;
    height: 440px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
    background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&h=900&fit=crop');
    background-size: cover;
    background-position: center;
  }

  .poster-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 10%, rgba(0, 0, 0, 0.05) 55%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
  }

  /* --- Property in focus: text-shadow --- */
  .movie-title {
    color: #ffffff;
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 6px;
    /* contrasting warm glow so the title pops off a dark background image */
    text-shadow: 0 0 12px rgba(255, 200, 0, 0.85),
                 0 2px 4px rgba(0, 0, 0, 0.9);
  }

  .movie-meta {
    color: #e0e0e0;
    font-size: 0.85rem;
    margin-bottom: 12px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  }

  .book-btn {
    background-color: #f84464;
    border: none;
    color: #fff;
    font-weight: 700;
    padding: 8px 0;
    width: 100%;
    border-radius: 6px;
  }

  .book-btn:hover {
    background-color: #d5314f;
    color: #fff;
  }
</style>
</head>
<body>

<div class="poster-card">
  <div class="poster-overlay">
    <div class="movie-title">MIDNIGHT ECHO</div>
    <div class="movie-meta">Thriller · 2h 18m · UA16+</div>
    <button type="button" class="book-btn" id="bookBtn">Book Tickets</button>
  </div>
</div>

<script>
  // Small JS interaction: booking confirmation
  const bookBtn = document.getElementById('bookBtn');
  bookBtn.addEventListener('click', function () {
    bookBtn.textContent = 'Redirecting to seats...';
    setTimeout(function () {
      bookBtn.textContent = 'Book Tickets';
    }, 1800);
  });
</script>

</body>
</html>
